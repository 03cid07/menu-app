<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="adminnav" aria-label="Admin sections">
    <div class="adminnav-in">
      <div class="adminnav-tabs" role="tablist">
        <button class="navlink" role="tab" data-tab="items" aria-selected="true">Items</button>
        <button class="navlink" role="tab" data-tab="add" aria-selected="false" id="tab-add">Add item</button>
        <button class="navlink" role="tab" data-tab="cats" aria-selected="false">Categories</button>
      </div>
      <div class="adminnav-side">
        <input id="pin" type="password" autocomplete="off" placeholder="Admin PIN" aria-label="Admin PIN">
        <a href="/" class="viewlink">View menu</a>
      </div>
    </div>
  </nav>
  <main>
    <div class="msg" id="msg" role="status"></div>
    <form class="panel" id="form" data-panel="add" hidden>
      <h2 id="form-title">Add item</h2>
      <input type="hidden" id="id">
      <label for="name">Name</label><input id="name" required>
      <div class="row">
        <div><label for="price">Price</label><input id="price" type="number" min="0" step="0.01" required></div>
        <div><label for="category">Category</label><input id="category" list="cat-list" required><datalist id="cat-list"></datalist></div>
      </div>
      <label for="description">Description</label><textarea id="description" rows="2"></textarea>
      <label for="ingredients">Ingredients</label><input id="ingredients" placeholder="e.g. Espresso, milk, caramel syrup">
      <div id="temp-box" hidden>
        <label for="temp">Serving (for the 3D animation)</label>
        <select id="temp">
          <option value="">Auto (guess from the name)</option>
          <option value="hot">Hot (steam)</option>
          <option value="cold">Cold (icy frost)</option>
        </select>
      </div>
      <label for="imageFile">Photos <small>(the first one is the cover, up to 8)</small></label>
      <input id="imageFile" type="file" accept="image/*" multiple>
      <div id="photo-grid" class="photo-grid"></div>
      <label for="modelFile">3D model (.glb)</label>
      <input id="modelFile" type="file" accept=".glb,model/gltf-binary">
      <input type="hidden" id="model">
      <div id="model-current"></div>
      <button class="btn ghost" type="button" id="model-remove" hidden>Remove 3D model</button>
      <label><input id="available" type="checkbox" checked style="width:auto"> Available today</label>
      <button class="btn" type="submit" id="save">Add item</button>
      <button class="btn ghost" type="button" id="cancel" hidden>Cancel edit</button>
    </form>
    <div class="panel" data-panel="cats" hidden><h2>Categories</h2>
      <p class="hint">Rename a category to change its name. Rename it to the name of another one to merge them, for example "drinks" into "Drinks". A category can be deleted once no dish uses it.</p>
      <div id="cat-manage"></div><div class="msg" id="cat-msg" role="status"></div></div>
    <div class="panel" data-panel="items"><h2>Current items</h2><div id="list"></div></div>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
