<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top"><h1>Manage menu</h1><p><a href="/">View public menu</a></p></header>
  <main>
    <div class="panel">
      <label for="pin">Admin PIN</label>
      <input id="pin" type="password" autocomplete="off">
    </div>
    <form class="panel" id="form">
      <h2 id="form-title">Add item</h2>
      <input type="hidden" id="id">
      <label for="name">Name</label><input id="name" required>
      <div class="row">
        <div><label for="price">Price</label><input id="price" type="number" min="0" step="0.01" required></div>
        <div><label for="category">Category</label><input id="category" list="cat-list" required><datalist id="cat-list"></datalist></div>
      </div>
      <label for="description">Description</label><textarea id="description" rows="2"></textarea>
      <label for="ingredients">Ingredients</label><input id="ingredients" placeholder="e.g. Espresso, milk, caramel syrup">
      <label for="imageFile">Photo</label>
      <input id="imageFile" type="file" accept="image/*">
      <input type="hidden" id="image">
      <div id="image-preview" hidden><img id="image-img" alt="Photo preview"><button class="btn ghost" type="button" id="image-remove">Remove photo</button></div>
      <label for="modelFile">3D model (.glb)</label>
      <input id="modelFile" type="file" accept=".glb,model/gltf-binary">
      <input type="hidden" id="model">
      <div id="model-current"></div>
      <button class="btn ghost" type="button" id="model-remove" hidden>Remove 3D model</button>
      <div id="size-box" hidden>
        <label for="modelScale">AR size: <strong id="scale-label">100</strong>% of the original</label>
        <input id="modelScale" type="range" min="1" max="200" step="1" value="100">
        <div id="model-size"></div>
      </div>
      <label><input id="available" type="checkbox" checked style="width:auto"> Available today</label>
      <button class="btn" type="submit" id="save">Add item</button>
      <button class="btn ghost" type="button" id="cancel" hidden>Cancel edit</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <div class="panel"><h2>Current items</h2><div id="list"></div></div>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
